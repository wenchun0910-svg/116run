<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>長安小鐵人計時表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入思源黑體(數字/內文) 與 思源宋體(標題) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'washi': '#f4f8fa',       /* 冷白/和紙 */
                        'ruri': '#1e50a2',        /* 瑠璃藍 (主色) */
                        'ruri-dark': '#0f3c81',   /* 深瑠璃 */
                        'asagi': '#00a3af',       /* 淺蔥 (次要色/按鈕) */
                        'asagi-dark': '#00858f',  /* 深淺蔥 */
                        'mizu': '#bce2e8',        /* 水色 (已點擊狀態) */
                        'sumi': '#2c3e50',        /* 墨黑偏藍 */
                        'silver': '#8994a0'       /* 銀灰 (輔助) */
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f4f8fa;
            /* 輕柔的日式藍染點陣背景 */
            background-image: radial-gradient(rgba(30, 80, 162, 0.1) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
        }
        
        /* Custom Scrollbar for the table */
        .table-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .table-scroll::-webkit-scrollbar-track {
            background: #eef2f5; 
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb {
            background: #8994a0; /* silver */
            border-radius: 4px;
        }
        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: #1e50a2; /* ruri */
        }

        /* Toast Animation */
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .toast-animate {
            animation: fadeInOut 3s forwards;
        }
    </style>
</head>
<body class="text-sumi min-h-screen flex flex-col font-sans relative">

    <!-- Header -->
    <header class="bg-white shadow-sm border-b-4 border-ruri py-4 px-6 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="w-12"></div> <!-- Spacer for centering -->
            <h1 class="text-3xl md:text-4xl font-serif font-black tracking-widest text-ruri-dark text-center">長安小鐵人計時表</h1>
            <button id="adminLoginBtn" class="text-silver hover:text-ruri flex flex-col items-center transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <span class="text-xs mt-1 font-bold">管理</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-4 md:p-6 max-w-7xl mx-auto w-full flex flex-col gap-4 md:gap-6">
        
        <!-- Settings Card (移至最上方) -->
        <section class="w-full max-w-3xl mx-auto">
            <div class="bg-white p-3 md:p-4 rounded-xl shadow-sm border border-gray-100 flex justify-center items-center gap-3 md:gap-4">
                <label for="studentCount" class="text-lg md:text-xl font-serif font-bold text-ruri whitespace-nowrap">班級人數：</label>
                <input type="number" id="studentCount" min="1" max="100" value="30" 
                       class="w-20 md:w-24 text-xl md:text-2xl text-center border-2 border-gray-200 rounded-lg p-1 md:p-2 focus:outline-none focus:border-asagi transition-colors bg-washi text-sumi font-bold">
                <span class="text-xs md:text-sm text-silver whitespace-nowrap">(系統將自動儲存設定)</span>
            </div>
        </section>

        <!-- Timer Block (Always at the top) -->
        <section class="w-full max-w-3xl mx-auto">
            <div class="bg-white p-4 md:p-6 rounded-xl shadow-md border-t-8 border-ruri text-center flex flex-col items-center relative">
                <h2 class="text-xl font-serif font-bold text-sumi mb-2 border-l-4 border-asagi pl-3 self-start">目前時間</h2>
                
                <div class="my-2 bg-washi w-full rounded-2xl py-4 md:py-6 border-2 border-ruri shadow-inner">
                    <div id="timerDisplay" class="text-5xl md:text-7xl font-mono font-bold text-ruri-dark tracking-widest">
                        00:00<span class="text-2xl md:text-4xl text-gray-400">.00</span>
                    </div>
                </div>

                <button id="startStopBtn" class="w-full md:w-2/3 bg-ruri hover:bg-ruri-dark text-white text-2xl font-serif py-3 md:py-4 rounded-full shadow-lg transform transition-all active:scale-95 tracking-widest mt-2 border-b-4 border-ruri-dark">
                    計時開始
                </button>
            </div>
        </section>

        <!-- Two Columns Layout for Students & Results -->
        <section class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Students -->
            <div class="lg:col-span-7 flex flex-col gap-6">
                <!-- Student Buttons Grid -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex-grow relative">
                    <h2 class="text-xl font-serif font-bold text-sumi mb-5 border-l-4 border-asagi pl-3">點擊座號記錄成績</h2>
                    <div id="studentButtonsContainer" class="flex flex-wrap gap-3 md:gap-4 justify-start">
                        <!-- Buttons will be injected here by JS -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: Results Table -->
            <div class="lg:col-span-5 flex flex-col gap-6">
                <!-- Results Table Card -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex-grow flex flex-col h-[400px] lg:h-[600px]">
                    <h2 class="text-xl font-serif font-bold text-sumi mb-4 border-l-4 border-ruri pl-3">成績紀錄表</h2>
                    
                    <div class="flex-grow overflow-y-auto table-scroll border-2 border-washi rounded-lg relative">
                        <table class="w-full text-center relative">
                            <thead class="bg-washi sticky top-0 z-10 shadow-sm text-ruri font-serif">
                                <tr>
                                    <th class="py-3 px-4 border-b border-gray-200 w-1/3">抵達順序</th>
                                    <th class="py-3 px-4 border-b border-gray-200 w-1/3">學生座號</th>
                                    <th class="py-3 px-4 border-b border-gray-200 w-1/3">完成時間</th>
                                </tr>
                            </thead>
                            <tbody id="resultsTableBody" class="text-lg">
                                <tr>
                                    <td colspan="3" class="py-10 text-gray-400 italic">尚無紀錄</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- Floating Action Buttons (Bottom Right) -->
    <div class="fixed bottom-6 right-6 flex flex-col gap-4 z-20">
        <!-- 雲端儲存按鈕 -->
        <button id="saveBtn" class="w-16 h-16 bg-asagi hover:bg-asagi-dark text-white rounded-full shadow-xl flex items-center justify-center transform transition-all active:scale-90 group relative border-2 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <span class="absolute right-full mr-4 bg-gray-800 text-white text-sm px-3 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity pointer-events-none font-serif">儲存至資料庫</span>
        </button>

        <!-- 下載 Excel 按鈕 -->
        <button id="exportBtn" class="w-16 h-16 bg-ruri hover:bg-ruri-dark text-white rounded-full shadow-xl flex items-center justify-center transform transition-all active:scale-90 group relative border-2 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span class="absolute right-full mr-4 bg-gray-800 text-white text-sm px-3 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity pointer-events-none font-serif">下載 Excel</span>
        </button>

        <!-- 重置按鈕 -->
        <button id="resetBtn" class="w-16 h-16 bg-red-700 hover:bg-red-800 text-white rounded-full shadow-xl flex items-center justify-center transform transition-all active:scale-90 group relative border-2 border-white">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            <span class="absolute right-full mr-4 bg-gray-800 text-white text-sm px-3 py-1 rounded opacity-0 group-hover:opacity-100 whitespace-nowrap transition-opacity pointer-events-none font-serif">全部重置</span>
        </button>
    </div>

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed top-24 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Admin Login Modal -->
    <div id="adminLoginModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center relative border-t-8 border-ruri">
            <button id="closeLoginModal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            <h3 class="text-2xl font-serif font-bold text-sumi mb-4">管理員登入</h3>
            <input type="password" id="adminPasswordInput" placeholder="請輸入密碼" class="w-full text-xl text-center border-2 border-gray-200 rounded-lg p-3 mb-6 focus:outline-none focus:border-ruri bg-washi">
            <button id="verifyPasswordBtn" class="w-full px-6 py-3 rounded-lg bg-ruri text-white font-serif font-bold text-lg hover:bg-ruri-dark transition-colors">登入系統</button>
        </div>
    </div>

    <!-- Admin Dashboard Modal -->
    <div id="adminDashboardModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-2xl max-w-3xl w-full max-h-[85vh] flex flex-col relative border-t-8 border-ruri">
            <button id="closeDashboardModal" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
            
            <div class="flex justify-between items-center mb-6 border-b-2 border-gray-100 pb-4">
                <h3 class="text-2xl font-serif font-bold text-sumi border-l-4 border-ruri pl-3">歷史成績管理</h3>
                <button id="changePwdBtn" class="text-sm bg-washi border border-silver text-sumi hover:bg-ruri hover:border-ruri hover:text-white px-4 py-2 rounded-lg transition-colors font-bold flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
                    更改密碼
                </button>
            </div>

            <div class="flex-grow overflow-y-auto pr-2 custom-scroll" id="adminRecordsList">
                <div class="text-center text-gray-500 py-8">資料載入中...</div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        let db;
        let auth;
        let currentUser = null;
        let firebaseReady = false;
        
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        try {
            const firebaseConfig = {
  apiKey: "AIzaSyALKXsEZe0fi0kgISPJu2yNAzle5l3jGUc",
  authDomain: "run-35022.firebaseapp.com",
  projectId: "run-35022",
  storageBucket: "run-35022.firebasestorage.app",
  messagingSenderId: "816498414456",
  appId: "1:816498414456:web:ab6753528d46eb611bae8d"
};

            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            };
            
            initAuth();

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    currentUser = user;
                    firebaseReady = true;
                } else {
                    firebaseReady = false;
                    currentUser = null;
                }
            });
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // App State
        let timerInterval = null;
        let startTime = 0;
        let isRunning = false;
        let records = []; 
        let currentRunSessionId = null;
        let isSessionSaved = false; 
        let isAdminLoggedIn = false;
        
        // 管理員密碼
        let ADMIN_PASSWORD = localStorage.getItem('changan_admin_pwd') || "1234"; 

        // DOM Elements
        const studentCountInput = document.getElementById('studentCount');
        const buttonsContainer = document.getElementById('studentButtonsContainer');
        const timerDisplay = document.getElementById('timerDisplay');
        const startStopBtn = document.getElementById('startStopBtn');
        const resultsTableBody = document.getElementById('resultsTableBody');
        const resetBtn = document.getElementById('resetBtn');
        const exportBtn = document.getElementById('exportBtn');
        const saveBtn = document.getElementById('saveBtn'); 
        const toastContainer = document.getElementById('toastContainer');

        const adminLoginBtn = document.getElementById('adminLoginBtn');
        const adminLoginModal = document.getElementById('adminLoginModal');
        const closeLoginModal = document.getElementById('closeLoginModal');
        const adminPasswordInput = document.getElementById('adminPasswordInput');
        const verifyPasswordBtn = document.getElementById('verifyPasswordBtn');
        
        const adminDashboardModal = document.getElementById('adminDashboardModal');
        const closeDashboardModal = document.getElementById('closeDashboardModal');
        const adminRecordsList = document.getElementById('adminRecordsList');
        const changePwdBtn = document.getElementById('changePwdBtn');

        // --- Core Functions ---

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            const bgColors = {
                'info': 'bg-gray-800 text-white',
                'error': 'bg-red-600 text-white',
                'success': 'bg-ruri-dark text-white'
            };
            toast.className = `${bgColors[type]} px-6 py-3 rounded-full shadow-lg font-medium text-center toast-animate font-serif tracking-wide`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            
            setTimeout(() => {
                if(toastContainer.contains(toast)) {
                    toastContainer.removeChild(toast);
                }
            }, 3000);
        }

        function initApp() {
            const savedCount = localStorage.getItem('changan_student_count');
            if (savedCount) {
                studentCountInput.value = savedCount;
            }
            renderStudentButtons(parseInt(studentCountInput.value));

            studentCountInput.addEventListener('change', (e) => {
                let count = parseInt(e.target.value);
                if (count < 1) { count = 1; e.target.value = 1; }
                if (count > 100) { count = 100; e.target.value = 100; }
                localStorage.setItem('changan_student_count', count);
                renderStudentButtons(count);
            });

            startStopBtn.addEventListener('click', toggleTimer);
            resetBtn.addEventListener('click', confirmReset);
            exportBtn.addEventListener('click', exportToCSV);
            saveBtn.addEventListener('click', saveAllToFirebase); 

            // Admin Listners
            adminLoginBtn.addEventListener('click', () => {
                if (isAdminLoggedIn) { 
                    openAdminDashboard(); 
                } else { 
                    adminLoginModal.classList.remove('hidden'); 
                    adminLoginModal.classList.add('flex'); 
                }
            });
            
            closeLoginModal.addEventListener('click', () => {
                adminLoginModal.classList.add('hidden'); 
                adminLoginModal.classList.remove('flex');
            });
            
            verifyPasswordBtn.addEventListener('click', () => {
                if (adminPasswordInput.value === ADMIN_PASSWORD) {
                    isAdminLoggedIn = true;
                    adminPasswordInput.value = '';
                    adminLoginModal.classList.add('hidden'); 
                    adminLoginModal.classList.remove('flex');
                    showToast('管理員登入成功', 'success');
                    openAdminDashboard();
                } else {
                    showToast('密碼錯誤', 'error');
                }
            });
            
            closeDashboardModal.addEventListener('click', () => {
                adminDashboardModal.classList.add('hidden'); 
                adminDashboardModal.classList.remove('flex');
            });

            changePwdBtn.addEventListener('click', () => {
                const newPwd = prompt("請輸入新的管理員密碼：\n(請妥善保管，若遺忘密碼需清除瀏覽器快取才能恢復預設的1234)");
                if (newPwd && newPwd.trim() !== "") {
                    ADMIN_PASSWORD = newPwd.trim();
                    localStorage.setItem('changan_admin_pwd', ADMIN_PASSWORD);
                    showToast('管理員密碼已成功更新！', 'success');
                }
            });
        }

        // Render Student Buttons
        function renderStudentButtons(count) {
            buttonsContainer.innerHTML = '';
            
            for (let i = 1; i <= count; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.id = `seat-btn-${i}`;
                
                btn.className = `w-14 h-14 md:w-16 md:h-16 rounded-full text-xl md:text-2xl font-bold shadow-sm transform transition-all flex items-center justify-center select-none active:scale-90 focus:outline-none focus:ring-4 focus:ring-asagi focus:ring-opacity-50 `;
                
                const isRecorded = records.some(r => r.seat === i);
                if (isRecorded) {
                    // 點擊後狀態 (水色背景，文字變深藍)
                    btn.classList.add('bg-mizu', 'text-ruri-dark', 'opacity-70', 'cursor-not-allowed', 'border-2', 'border-white', 'shadow-inner');
                    btn.disabled = true;
                } else {
                    // 未點擊狀態 (淺蔥色)
                    btn.classList.add('bg-asagi', 'hover:bg-asagi-dark', 'text-white', 'cursor-pointer', 'border-b-4', 'border-asagi-dark');
                    btn.onclick = () => handleSeatClick(i);
                }
                
                buttonsContainer.appendChild(btn);
            }
        }

        function toggleTimer() {
            if (!isRunning) {
                isRunning = true;
                if (startTime === 0) {
                    startTime = Date.now();
                    currentRunSessionId = `run_${Date.now()}`;
                    showToast('計時開始！', 'success');
                } else {
                    if(records.length > 0 && confirm("繼續上一次的計時？取消則重新開始")) {
                        // Keep going
                    } else {
                         startTime = Date.now();
                         records = [];
                         currentRunSessionId = `run_${Date.now()}`;
                         renderStudentButtons(parseInt(studentCountInput.value));
                         updateTableUI();
                    }
                }
                
                startStopBtn.textContent = '計時結束';
                startStopBtn.classList.remove('bg-ruri', 'hover:bg-ruri-dark', 'border-ruri-dark');
                startStopBtn.classList.add('bg-silver', 'hover:bg-gray-500', 'border-gray-500');
                
                timerInterval = setInterval(updateTimerDisplay, 47); 
            } else {
                isRunning = false;
                clearInterval(timerInterval);
                startStopBtn.textContent = '計時開始';
                startStopBtn.classList.remove('bg-silver', 'hover:bg-gray-500', 'border-gray-500');
                startStopBtn.classList.add('bg-ruri', 'hover:bg-ruri-dark', 'border-ruri-dark');
                showToast('計時已結束，請檢視成績表格。', 'info');
            }
        }

        function updateTimerDisplay() {
            const elapsed = Date.now() - startTime;
            timerDisplay.innerHTML = formatTime(elapsed);
        }

        function formatTime(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            
            const mm = minutes.toString().padStart(2, '0');
            const ss = seconds.toString().padStart(2, '0');
            const cc = centiseconds.toString().padStart(2, '0');
            
            return `${mm}:${ss}<span class="text-2xl md:text-4xl text-gray-400">.${cc}</span>`;
        }

        function getFormattedTimeString(ms) {
            const totalSeconds = Math.floor(ms / 1000);
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            const centiseconds = Math.floor((ms % 1000) / 10);
            return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}.${centiseconds.toString().padStart(2, '0')}`;
        }

        async function handleSeatClick(seatNum) {
            if (!isRunning) {
                showToast('請先按下「計時開始」按鈕！', 'error');
                return;
            }

            const elapsedMs = Date.now() - startTime;
            const timeString = getFormattedTimeString(elapsedMs);
            const order = records.length + 1;

            const record = { order: order, seat: seatNum, time: timeString };
            records.push(record);
            isSessionSaved = false; 

            const btn = document.getElementById(`seat-btn-${seatNum}`);
            if (btn) {
                btn.className = `w-14 h-14 md:w-16 md:h-16 rounded-full text-xl md:text-2xl font-bold transform transition-all flex items-center justify-center select-none bg-mizu text-ruri-dark opacity-70 cursor-not-allowed border-2 border-white shadow-inner`;
                btn.disabled = true;
            }

            updateTableUI();
        }

        function updateTableUI() {
            if (records.length === 0) {
                resultsTableBody.innerHTML = `<tr><td colspan="3" class="py-10 text-gray-400 italic">尚無紀錄</td></tr>`;
                return;
            }

            resultsTableBody.innerHTML = '';
            const displayRecords = [...records].reverse(); 

            displayRecords.forEach(record => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-100 hover:bg-gray-50 transition-colors";
                tr.innerHTML = `
                    <td class="py-3 px-4 text-silver font-bold">#${record.order}</td>
                    <td class="py-3 px-4 font-bold text-sumi text-xl">${record.seat}</td>
                    <td class="py-3 px-4 font-mono text-ruri-dark font-bold text-xl">${record.time}</td>
                `;
                resultsTableBody.appendChild(tr);
            });
        }

        async function saveAllToFirebase() {
            if (records.length === 0) {
                showToast("目前沒有成績可以儲存！", 'error');
                return;
            }
            if (isSessionSaved) {
                showToast("這筆成績已經儲存過了喔！", 'info');
                return;
            }
            if (!firebaseReady || !currentUser || !db) {
                showToast("Firebase尚未連線，資料將只保存在目前的畫面中。", 'error');
                return;
            }

            const originalBtnContent = saveBtn.innerHTML;
            saveBtn.innerHTML = `<svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            saveBtn.disabled = true;

            try {
                const sessionRef = collection(db, 'artifacts', appId, 'public', 'data', 'run_sessions');
                const sortedRecords = [...records].sort((a, b) => a.order - b.order);

                await addDoc(sessionRef, {
                    sessionId: currentRunSessionId || `run_${Date.now()}`,
                    userId: currentUser.uid,
                    studentCount: studentCountInput.value,
                    records: sortedRecords, 
                    timestamp: serverTimestamp(),
                    className: "長安小鐵人"
                });
                
                isSessionSaved = true;
                showToast("✅ 全班成績已成功上傳至雲端資料庫！", 'success');
            } catch (error) {
                console.error("Firebase save error: ", error);
                showToast("成績上傳失敗，請檢查網路連線", 'error');
            } finally {
                saveBtn.innerHTML = originalBtnContent;
                saveBtn.disabled = false;
            }
        }

        function confirmReset() {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center backdrop-blur-sm";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-t-8 border-ruri">
                    <h3 class="text-2xl font-serif font-bold text-sumi mb-4">確認重置？</h3>
                    <p class="text-gray-600 mb-8">這將會清除畫面上所有的成績與計時資料，確定要繼續嗎？</p>
                    <div class="flex gap-4 justify-center">
                        <button id="cancelReset" class="px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">取消</button>
                        <button id="confirmResetAction" class="px-6 py-2 rounded-lg bg-red-600 text-white font-bold hover:bg-red-700">確定清除</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);

            document.getElementById('cancelReset').onclick = () => document.body.removeChild(modal);
            document.getElementById('confirmResetAction').onclick = () => {
                executeReset();
                document.body.removeChild(modal);
            };
        }

        function executeReset() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                startStopBtn.textContent = '計時開始';
                startStopBtn.classList.remove('bg-silver', 'hover:bg-gray-500', 'border-gray-500');
                startStopBtn.classList.add('bg-ruri', 'hover:bg-ruri-dark', 'border-ruri-dark');
            }

            startTime = 0;
            records = [];
            currentRunSessionId = null;
            isSessionSaved = false; 
            
            timerDisplay.innerHTML = `00:00<span class="text-2xl md:text-4xl text-gray-400">.00</span>`;
            updateTableUI();
            renderStudentButtons(parseInt(studentCountInput.value));
            
            showToast('資料已重置', 'info');
        }

        async function exportToCSV() {
            const originalBtnContent = exportBtn.innerHTML;
            exportBtn.innerHTML = `<svg class="animate-spin h-8 w-8 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            exportBtn.disabled = true;

            try {
                let sessionsToExport = [];

                if (firebaseReady && currentUser && db) {
                    const sessionRef = collection(db, 'artifacts', appId, 'public', 'data', 'run_sessions');
                    const querySnapshot = await getDocs(sessionRef);
                    
                    let fetchedSessions = [];
                    querySnapshot.forEach((doc) => {
                        const data = doc.data();
                        if (data.userId === currentUser.uid) {
                            fetchedSessions.push(data);
                        }
                    });
                    
                    fetchedSessions.sort((a, b) => {
                        const timeA = a.timestamp?.toMillis() || parseInt(a.sessionId.split('_')[1]);
                        const timeB = b.timestamp?.toMillis() || parseInt(b.sessionId.split('_')[1]);
                        return timeA - timeB;
                    });

                    sessionsToExport = fetchedSessions.map(s => s.records);
                }

                if (records.length > 0 && !isSessionSaved) {
                    sessionsToExport.push(records);
                }

                if (sessionsToExport.length === 0) {
                    showToast('目前沒有任何成績可以下載！', 'error');
                    return;
                }

                const totalStudents = parseInt(studentCountInput.value);
                let csvContent = "\uFEFF";
                
                let headerRow = ["座號"];
                for (let s = 0; s < sessionsToExport.length; s++) {
                    headerRow.push(`第${s + 1}次時間`);
                    // 移除了排名的欄位標題
                }
                csvContent += headerRow.join(",") + "\n";
                
                for (let i = 1; i <= totalStudents; i++) {
                    let row = [i];
                    for (let s = 0; s < sessionsToExport.length; s++) {
                        const sessionRecords = sessionsToExport[s];
                        const record = sessionRecords.find(r => r.seat === i);
                        if (record) {
                            row.push(record.time);
                            // 移除了排名的資料
                        } else {
                            row.push("未完成");
                        }
                    }
                    csvContent += row.join(",") + "\n";
                }

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                const dateStr = new Date().toLocaleDateString('zh-TW').replace(/\//g, '');
                link.setAttribute("download", `長安小鐵人_歷史總成績_${dateStr}.csv`);
                
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showToast('歷史成績試算表下載完成！', 'success');

            } catch (error) {
                console.error("Export error: ", error);
                showToast('下載失敗，請稍後再試。', 'error');
            } finally {
                exportBtn.innerHTML = originalBtnContent;
                exportBtn.disabled = false;
            }
        }

        // --- Admin Functions ---
        async function openAdminDashboard() {
            adminDashboardModal.classList.remove('hidden');
            adminDashboardModal.classList.add('flex');
            adminRecordsList.innerHTML = '<div class="text-center text-gray-500 py-8">資料載入中...</div>';

            if (!firebaseReady || !currentUser || !db) {
                adminRecordsList.innerHTML = '<div class="text-center text-red-500 py-8">無法連線到資料庫，請檢查網路</div>';
                return;
            }

            try {
                const sessionRef = collection(db, 'artifacts', appId, 'public', 'data', 'run_sessions');
                const querySnapshot = await getDocs(sessionRef);
                
                let fetchedSessions = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if (data.userId === currentUser.uid) {
                        fetchedSessions.push({ id: docSnap.id, ...data });
                    }
                });

                fetchedSessions.sort((a, b) => {
                    const timeA = a.timestamp?.toMillis() || parseInt(a.sessionId.split('_')[1]);
                    const timeB = b.timestamp?.toMillis() || parseInt(b.sessionId.split('_')[1]);
                    return timeB - timeA; 
                });

                window.currentAdminSessions = fetchedSessions;

                if (fetchedSessions.length === 0) {
                    adminRecordsList.innerHTML = '<div class="text-center text-gray-500 py-8">目前沒有任何雲端歷史紀錄</div>';
                    return;
                }

                adminRecordsList.innerHTML = '';
                fetchedSessions.forEach((session) => {
                    const dateObj = session.timestamp ? session.timestamp.toDate() : new Date(parseInt(session.sessionId.split('_')[1]));
                    const dateString = dateObj.toLocaleString('zh-TW', { hour12: false });
                    
                    const recordDiv = document.createElement('div');
                    recordDiv.className = "flex flex-col md:flex-row justify-between items-start md:items-center bg-gray-50 p-4 rounded-lg mb-4 border border-gray-200 gap-3";
                    recordDiv.innerHTML = `
                        <div>
                            <div class="font-bold text-ruri text-lg">測驗時間：${dateString}</div>
                            <div class="text-sm text-gray-500 mt-1">共紀錄 ${session.records.length} 位學生成績</div>
                        </div>
                        <div class="flex gap-2 w-full md:w-auto">
                            <a href="#" onclick="viewSessionRecord('${session.id}'); return false;" class="flex-1 md:flex-none justify-center px-4 py-2 bg-asagi hover:bg-asagi-dark text-white rounded-lg text-sm font-bold shadow transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>
                                查看明細
                            </a>
                            <button class="flex-1 md:flex-none justify-center px-4 py-2 bg-ruri hover:bg-ruri-dark text-white rounded-lg text-sm font-bold shadow transition-colors flex items-center gap-1" onclick="deleteSessionRecord('${session.id}')">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                                刪除
                            </button>
                        </div>
                    `;
                    adminRecordsList.appendChild(recordDiv);
                });

            } catch (error) {
                console.error("Fetch sessions error:", error);
                adminRecordsList.innerHTML = '<div class="text-center text-red-500 py-8">讀取資料失敗</div>';
            }
        }

        window.viewSessionRecord = function(docId) {
            if (!window.currentAdminSessions) return;
            const session = window.currentAdminSessions.find(s => s.id === docId);
            if (!session) return;

            const dateObj = session.timestamp ? session.timestamp.toDate() : new Date(parseInt(session.sessionId.split('_')[1]));
            const dateString = dateObj.toLocaleString('zh-TW', { hour12: false });

            const sortedRecords = [...session.records].sort((a, b) => a.order - b.order);
            let tableRows = '';
            sortedRecords.forEach(r => {
                tableRows += `<tr><td>${r.order}</td><td>${r.seat}</td><td class="time-col">${r.time}</td></tr>`;
            });

            const htmlContent = `
<!DOCTYPE html>
<html lang="zh-TW">
<head>

        </div>
        <table>

                <tr>

            const newWindow = window.open('', '_blank');
            if (newWindow) {
                newWindow.document.write(htmlContent);
                newWindow.document.close();
            } else {
                showToast('彈出視窗被瀏覽器封鎖了，請允許開啟新視窗。', 'error');
            }
        };

        window.deleteSessionRecord = function(docId) {
            const modal = document.createElement('div');
            modal.className = "fixed inset-0 bg-black bg-opacity-50 z-[60] flex items-center justify-center backdrop-blur-sm";
            modal.innerHTML = `
                <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full text-center border-t-8 border-ruri">
                    <h3 class="text-2xl font-serif font-bold text-sumi mb-4">確認刪除？</h3>
                    <p class="text-gray-600 mb-8">此動作將永久刪除該次測驗的所有成績，刪除後無法復原。確定要繼續嗎？</p>
                    <div class="flex gap-4 justify-center">
                        <button id="cancelDelete" class="px-6 py-2 rounded-lg bg-gray-200 text-gray-700 font-bold hover:bg-gray-300">取消</button>
                        <button id="confirmDelete" class="px-6 py-2 rounded-lg bg-red-600 text-white font-bold hover:bg-red-700">確定刪除</button>
                    </div>

            `;

            document.getElementById('cancelDelete').onclick = () => document.body.removeChild(modal);
